<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPECTRA Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* ─── Obsidian Flow — Core Animations ─── */

      /* Ambient gradient shift for backgrounds */
      @keyframes ambientShift {
        0%, 100% { background-position: 0% 50%; }
        50%      { background-position: 100% 50%; }
      }

      /* Subtle pulse for live indicators */
      @keyframes pulseGlow {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.6; transform: scale(0.95); }
      }

      /* Stronger glow pulse for focused elements */
      @keyframes glowPulse {
        0%, 100% { opacity: 1; filter: brightness(1); }
        50%      { opacity: 0.8; filter: brightness(1.2); }
      }

      /* Neon flash on price changes */
      @keyframes neonFlash {
        0%   { filter: brightness(2.5) saturate(1.5); }
        100% { filter: brightness(1) saturate(1); }
      }

      /* Green flash for price up */
      @keyframes flashGreen {
        0%   { background-color: rgba(16, 185, 129, 0.25); }
        100% { background-color: transparent; }
      }

      /* Red flash for price down */
      @keyframes flashRed {
        0%   { background-color: rgba(239, 68, 68, 0.25); }
        100% { background-color: transparent; }
      }

      /* Panel entrance */
      @keyframes panelSlideIn {
        from { opacity: 0; transform: translateY(6px) scale(0.99); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Data stream in from left */
      @keyframes dataStreamIn {
        from { opacity: 0; transform: translateX(-6px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Staggered fade up for lists */
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Right slide for breadcrumbs */
      @keyframes slideRight {
        from { transform: translateX(-4px); opacity: 0; }
        to   { transform: translateX(0); opacity: 1; }
      }

      /* Expand down for collapsibles */
      @keyframes expandDown {
        from { opacity: 0; transform: scaleY(0); transform-origin: top; }
        to   { opacity: 1; transform: scaleY(1); transform-origin: top; }
      }

      /* Marquee for ticker tape */
      @keyframes marquee {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }

/* Breathing border glow for focused panels */
      @keyframes borderBreathe {
        0%, 100% { opacity: 0.6; }
        50%      { opacity: 1; }
      }

      /* Tick pulse — a dot sliding across the ticker tape to visualize heartbeat */
      @keyframes tickPulse {
        0%   { transform: translateX(-10%); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateX(100vw); opacity: 0; }
      }

      /* Odometer digit roll — per-digit vertical translate */
      @keyframes odometerRoll {
        from { transform: translateY(-100%); opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }
      @keyframes odometerRollDown {
        from { transform: translateY(100%);  opacity: 0; }
        to   { transform: translateY(0);     opacity: 1; }
      }

      /* Decode scramble reveal — character-by-character glitch */
      @keyframes decodeReveal {
        0%   { opacity: 0.2; filter: blur(0.5px); }
        50%  { opacity: 0.8; filter: blur(0); }
        100% { opacity: 1;   filter: blur(0); }
      }

      /* Corner bracket draw-in */
      @keyframes cornerDrawIn {
        from { opacity: 0; transform: scale(0.6); }
        to   { opacity: 1; transform: scale(1); }
      }

      /* Chromatic aberration shimmer (very subtle) */
      @keyframes chromaDrift {
        0%, 100% { text-shadow: -0.5px 0 rgba(251,191,36,0.35), 0.5px 0 rgba(34,211,238,0.25); }
        50%      { text-shadow: -0.8px 0 rgba(251,191,36,0.45), 0.8px 0 rgba(34,211,238,0.35); }
      }

/* ─── Global resets ─── */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body, #root {
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #03030a;
        color: #EEEEF2;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ─── Utility ─── */
      .tabular-nums { font-variant-numeric: tabular-nums; }

      /* ─── Custom scrollbar ─── */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* ─── Shimmer animation for skeleton loading ─── */
      @keyframes shimmer {
        to { background-position: -200% 0; }
      }

      .bb-shimmer {
        background: linear-gradient(90deg, #08081a 25%, #0e0e24 50%, #08081a 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
      }

      .bb-skeleton-text {
        color: rgba(245, 158, 11, 0.1);
      }

      /* ─── Selection ─── */
      ::selection {
        background: rgba(245, 158, 11, 0.3);
        color: #FBBF24;
      }

      /* ─── Noise overlay (applied via pseudo-element on #root) ─── */
      #root::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.015'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 9999;
        opacity: 0.4;
        mix-blend-mode: overlay;
      }

      /* ─── Phosphor scanlines overlay — subtle CRT feel ─── */
      .bb-scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9998;
        background-image:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.018) 0,
            rgba(255, 255, 255, 0.018) 1px,
            transparent 1px,
            transparent 3px
          );
        mix-blend-mode: overlay;
        opacity: 0.7;
      }

      /* Optional strong vignette at edges for CRT barrel feel */
      .bb-vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9997;
        background:
          radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.35) 100%);
      }

      /* ─── Chromatic aberration on neon text ─── */
      .bb-chroma {
        text-shadow:
          -0.5px 0 rgba(251, 191, 36, 0.30),
           0.5px 0 rgba(34, 211, 238, 0.22);
      }
      .bb-chroma-strong {
        animation: chromaDrift 6s ease-in-out infinite;
      }

      /* ─── Glass refraction (inset highlight / shadow) ─── */
      .bb-glass-refract {
        box-shadow:
          inset 1px 1px 0 rgba(255, 255, 255, 0.06),
          inset -1px -1px 0 rgba(0, 0, 0, 0.35);
      }

      /* ─── Odometer digit wheel ─── */
      .bb-odometer {
        display: inline-flex;
        overflow: hidden;
        vertical-align: baseline;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum';
      }
      .bb-odometer-cell {
        position: relative;
        display: inline-block;
        overflow: hidden;
      }
      .bb-odometer-digit {
        display: inline-block;
        animation: odometerRoll 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .bb-odometer-digit-down {
        animation: odometerRollDown 220ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* ─── Decode scramble cell ─── */
      .bb-decode-char {
        display: inline-block;
        animation: decodeReveal 220ms ease-out both;
      }

      /* ─── Corner brackets ─── */
      .bb-corner {
        position: absolute;
        width: 12px;
        height: 12px;
        pointer-events: none;
        animation: cornerDrawIn 260ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* ─── Hover crosshair row (DataTable) ─── */
      table.bb-table tbody tr.bb-row-hover::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(245,158,11,0.25) 15%, rgba(245,158,11,0.25) 85%, transparent);
        pointer-events: none;
      }
      table.bb-table tbody tr { position: relative; transition: background 120ms ease; }
      table.bb-table tbody tr.bb-row-hover {
        background: rgba(245, 158, 11, 0.05) !important;
        box-shadow: inset 2px 0 0 rgba(245, 158, 11, 0.55);
      }

      /* ─── Ambient gradient blobs ─── */
      #root::after {
        content: '';
        position: fixed;
        top: -20%;
        left: -10%;
        width: 60%;
        height: 60%;
        background: radial-gradient(ellipse, rgba(245, 158, 11, 0.03) 0%, transparent 70%);
        pointer-events: none;
        z-index: -1;
        animation: ambientShift 20s ease-in-out infinite;
        background-size: 200% 200%;
      }

      /* ─── Cursor blink ─── */
      .bb-cursor {
        animation: cursorBlink 1s steps(1) infinite;
      }
      @keyframes cursorBlink {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }

      /* ─── Glass panel utility ─── */
      .glass-surface {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px) saturate(1.2);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
      }

      /* ─── Micro-interactions ─── */
      button, [role="button"], a {
        cursor: pointer;
        transition: all 150ms ease;
      }
      button:active:not(:disabled) {
        transform: scale(0.97);
      }
      :focus-visible {
        outline: 2px solid rgba(245, 158, 11, 0.25);
        outline-offset: 2px;
      }
      :focus:not(:focus-visible) {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
